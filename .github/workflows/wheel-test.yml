name: Wheel build and install test

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build and test"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build and test"
        required: true
        type: string

jobs:
  wheel-test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
        with:
          poetry-version: 2.5.1

      - name: install libomp for macos (required by meshkernel)
        if: matrix.os == 'macos-latest'
        run: |
          brew install libomp

      - name: Build wheel
        run: poetry build -f wheel

      - name: Install wheel in fresh venv and run tests
        shell: bash
        run: |
          python -m venv test-venv
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test-venv/Scripts/activate
          else
            source test-venv/bin/activate
          fi

          pip install dist/*.whl
          pip install pytest pyfakefs xarray
          pytest -v

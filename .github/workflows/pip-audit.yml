name: pip-audit

# Dependency-vulnerability scan. CVEs are disclosed over time against packages we already
# ship, so besides every PR the weekly schedule re-audits the unchanged tree and catches a
# freshly disclosed vulnerability without needing a code change.

permissions:
  contents: read

on:
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    # poetry.lock can resolve different package versions per python version, so every python version of the test
    # matrix in tests.yml is audited. Keep this list in sync with tests.yml.
    # The python 3.10 leg is report-only: its locked pillow and tornado have known advisories whose fixed releases
    # require python >= 3.11, so no upgrade exists. Findings there show up as a warning but do not fail the workflow.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python with Poetry
        uses: Deltares-research/github-actions/actions/python-setup/poetry@35542e0d629396ac64162d8a5df6110484009147 # poetry/v1.1.2
        with:
          python-version: ${{ matrix.python-version }}
          version: 2.5.1

      - name: Audit dependencies with pip-audit
        id: audit
        # pip-audit checks the pinned packages of the locked environment against the
        # PyPI/OSV advisory DB. It is run via pipx so it is never added to the project's
        # own dependency graph. The step fails only when a real vulnerability is reported
        # (pip-audit exits non-zero); on the report-only python 3.10 leg that failure does not fail the job.
        continue-on-error: ${{ matrix.python-version == '3.10' }}
        run: |
          poetry run python -m pip freeze --exclude-editable \
            | grep -E '^[A-Za-z0-9_.-]+==' > "${RUNNER_TEMP}/pip-audit-reqs.txt"
          echo "Auditing $(wc -l < "${RUNNER_TEMP}/pip-audit-reqs.txt") pinned packages against the advisory DB"
          pipx run pip-audit --requirement "${RUNNER_TEMP}/pip-audit-reqs.txt" --desc

      - name: Report advisories on the report-only python version
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::pip-audit found advisories on python ${{ matrix.python-version }} (report-only, not failing the workflow)."

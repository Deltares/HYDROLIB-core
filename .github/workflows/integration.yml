name: fm_container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python with Poetry
        uses: Deltares-research/github-actions/actions/python-setup/poetry@35542e0d629396ac64162d8a5df6110484009147 # poetry/v1.1.2
        with:
          python-version: ${{ matrix.python-version }}
          version: 2.3.3

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull image from DockerHub
        run: docker pull deltares/delft3dfm

      - name: Run only integration test to generate input
        run: poetry run pytest -m docker

      - name: Run image in container
        run: docker run  -v $(pwd)/tests/data/output/docker:/data deltares/delft3dfm /opt/delft3dfm_latest/lnx64/bin/run_dimr.sh

version: 1.1
mdu:
    deprecated_keywords: [Allowcoolingbelowzero, RhoairRhowater]
    deprecated_value: 0

external_forcing:
    unsupported_quantities:
        # Meteo
        - windstresscoefficient
        - wind_speed
        - wind_from_direction
        # Parameters
        - floe_diameter
        - waqmonitoringarea
        - ibotlevtype
        - friction_coefficient_time_dependent
        # structure
        - damlevel
        - gateloweredgelevel
        - generalstructure
        - pump
        - pump1d
        - checkvalve
        - valve1D
        # no type of forcing
        - __bathymetry__
        - erodablelayerthicknessgrainsize1
        - erodablelayerthicknessgrainsize2
        - erodablelayerthicknessgrainsize3
        - shiptxy
        # will be moved from the initial conditions file to the new forcing file
        # do not convert for now
        - bedrock_surface_elevation
    unsupported_prefixes:
        # initial conditions
        - initialsediment
    # Quantities the kernel spells differently in the initial and parameter fields
    # file than in the old external forcings file. Keys are matched
    # case-insensitively; values are emitted verbatim, so their casing matters.
    renamed_quantities:
        sea_ice_thickness: seaIceThickness
        sea_ice_area_fraction: seaIceAreaFraction
        nudge_salinity_temperature: nudgeSalinityTemperature
        # `bedrock_surface_elevation` is also in `unsupported_quantities` above, so a run of the converter
        # rejects it.
        bedrock_surface_elevation: bedrockSurfaceElevation
        friction_coefficient_time_dependent: frictionCoefficientTimeDependent
        windspeedfactor: windxy
        solarradiationfactor: solarradiation

    vector_quantities:
        uxuyadvectionvelocitybnd: {"ux": "m s-1", "uy": "m s-1"}
        windxy: {"wx": "m s-1", "wy": "m s-1"}

    # Combined quantities: a single old-style QUANTITY that bundles several component variables, in the
    # column order the kernel reads them. Units follow the User Manual (heat flux model 5: humidity and
    # cloudiness in %).
    #
    # The heat-flux families (humidity_*/dewpoint_*) are supplied as a uniform multi-column time series, so
    # the component units below are used when their data column count is checked. The airpressure_* families
    # are only ever supplied as curvi, spiderweb or netcdf files (never uniform), so the converter passes
    # their file through unchanged with the mapped dataFileType and the component units below are not used.
    combined_quantities:
        humidity_airtemperature_cloudiness: {"humidity": "%", "airtemperature": "degC", "cloudiness": "%"}
        humidity_airtemperature_cloudiness_solarradiation: {"humidity": "%", "airtemperature": "degC", "cloudiness": "%", "solarradiation": "W/m2"}
        dewpoint_airtemperature_cloudiness: {"dewpoint": "degC", "airtemperature": "degC", "cloudiness": "%"}
        dewpoint_airtemperature_cloudiness_solarradiation: {"dewpoint": "degC", "airtemperature": "degC", "cloudiness": "%", "solarradiation": "W/m2"}
        airpressure_windx_windy: {"airpressure": "Pa", "windx": "m/s", "windy": "m/s"}
        airpressure_windx_windy_charnock: {"airpressure": "Pa", "windx": "m/s", "windy": "m/s", "charnock": "-"}
        airpressure_stressx_stressy: {"airpressure": "Pa", "stressx": "N/m2", "stressy": "N/m2"}
